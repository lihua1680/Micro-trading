<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关于我们内容:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-company_desc" class="form-control editor" rows="15" name="row[company_desc]" cols="50">{$row.company_desc|htmlentities}</textarea>
            <span class="help-block">前端「关于我们」页面将读取此处内容，支持富文本/HTML。</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
<script>
    require(['form'], function (Form) {
        Form.api.bindevent($("form[role=form]"));
    });
</script>
